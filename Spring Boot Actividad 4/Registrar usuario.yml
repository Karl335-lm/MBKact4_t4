info:
  name: Registrar usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8088/api/auth/register
  body:
    type: json
    data: |-
      {
          "nombre": "Karla",
          "email": "karla@gmail.com",
          "password": "Karla12345"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
